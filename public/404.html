    <title>Raúl Rodríguez — Senior Frontend Engineer</title>
    <script type="text/javascript">
      var routes = {
        '/home': '/#home',
        '/experience': '/#experience',
        '/expertise': '/#what-i-do',
        '/contact': '/#contact'
      };

      window.location.replace(target + window.location.search);
    </script>
